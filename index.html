<style>
/* =====================================================================
   نظام التصميم
   ===================================================================== */
:root {
    --brand: #1d4ed8;
    --brand-600: color-mix(in srgb, var(--brand) 88%, #000);
    --brand-50: color-mix(in srgb, var(--brand) 7%, #fff);
    --brand-100: color-mix(in srgb, var(--brand) 14%, #fff);
    --brand-200: color-mix(in srgb, var(--brand) 28%, #fff);
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f8fafc; --line: #e3e8ef; --line-2: #cfd7e2;
    --ink: #0f172a; --ink-2: #334155; --muted: #64748b; --faint: #94a3b8;
    --ok: #0f766e; --ok-50: #e7f6f3; --warn: #b45309; --warn-50: #fff5e6; --bad: #b91c1c; --bad-50: #fdecec;
    --info: #1e40af; --info-50: #eaf1ff;
    --gross-bg: #e6efff; --net-bg: #e4f5ee; --net-ink: #0b5e4a;
    --radius: 10px; --radius-sm: 7px;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .05);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, .16);
    --sidebar-w: 248px; --topbar-h: 60px;
    --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--brand); }
.num, .money, td.money, input[type=number] { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.hidden { display: none !important; }
svg.ic { width: 18px; height: 18px; flex: none; vertical-align: middle; }
.empty svg.ic { width: 42px; height: 42px; }
.btn.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- الهيكل ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); background: #0f172a; color: #cbd5e1; position: fixed; top: 0; bottom: 0; right: 0; display: flex; flex-direction: column; z-index: 40; transition: transform .2s; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,.07); min-height: var(--topbar-h); }
.sb-logo { width: 36px; height: 36px; border-radius: 9px; background: var(--brand); display: grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; flex: none; }
.sb-logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.sb-title { font-weight: 700; color: #fff; font-size: 14px; line-height: 1.3; }
.sb-sub { font-size: 11px; color: #94a3b8; }
.sb-nav { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
.sb-group { font-size: 11px; color: #64748b; padding: 14px 10px 6px; letter-spacing: .3px; }
.sb-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: transparent; color: #cbd5e1; border-radius: 8px; cursor: pointer; text-align: start; font-size: 13.5px; text-decoration: none; }
.sb-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.sb-item.active { background: var(--brand); color: #fff; }
.sb-item .ic { width: 18px; height: 18px; flex: none; opacity: .9; }
.sb-item .badge { margin-inline-start: auto; }
.sb-foot { padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.07); font-size: 11.5px; color: #94a3b8; }
.sb-foot b { color: #e2e8f0; font-weight: 600; }
.sb-about { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 14px; border: 0; border-top: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.03); color: #94a3b8; cursor: pointer; font-size: 11px; text-align: start; }
.sb-about:hover { background: rgba(255,255,255,.07); color: #e2e8f0; }
.sb-about b { color: #fff; font-size: 13px; letter-spacing: .5px; padding: 1px 6px; border-radius: 5px; background: var(--brand); }
.sb-about span { flex: 1; line-height: 1.3; }
.sb-about small { opacity: .7; }
.brand-block { text-align: center; padding: 6px 0 2px; }
.brand-block .bb-name { font-size: 26px; font-weight: 700; letter-spacing: .5px; color: var(--brand); }
.brand-block .bb-sub { font-size: 15px; font-weight: 600; margin-top: 2px; }
.brand-block .bb-maker { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.about-notes { margin-top: 12px; font-size: 13px; }
.about-notes p { margin: 0 0 8px; }
.main { flex: 1; margin-inline-start: var(--sidebar-w); min-width: 0; display: flex; flex-direction: column; overflow-x: clip; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.tb-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-spacer { flex: 1; }
.month-ctl { display: flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.month-ctl input { border: 0; background: transparent; padding: 4px 6px; width: 150px; font-weight: 600; }
.month-ctl input:focus { outline: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip.ok { background: var(--ok-50); color: var(--ok); border-color: #bfe6dd; }
.chip.warn { background: var(--warn-50); color: var(--warn); border-color: #f5d7a8; }
.chip.bad { background: var(--bad-50); color: var(--bad); border-color: #f4c2c2; }
.chip.info { background: var(--info-50); color: var(--info); border-color: #c9d8fb; }
.chip.gray { background: #eef1f5; color: var(--ink-2); border-color: var(--line); }
.chip.dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge { min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; background: var(--bad); color: #fff; }
.content { padding: 18px 20px 60px; max-width: 1680px; width: 100%; margin: 0 auto; }

/* ---------- الأزرار ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, box-shadow .12s; }
.btn:hover { background: var(--surface-2); border-color: #b8c3d2; }
.btn:focus-visible { outline: 2px solid var(--brand-200); outline-offset: 1px; }
.btn:disabled, .btn.disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn .ic { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-600); }
.btn.success { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); border-color: #f1c7c7; }
.btn.danger-ghost:hover { background: var(--bad-50); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: #eef1f5; }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
.btn.xs { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }
.btn.tb-menu { display: none; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; margin-inline-start: -1px; }
.btn-group .btn:first-child { border-start-start-radius: 8px; border-end-start-radius: 8px; margin: 0; }
.btn-group .btn:last-child { border-start-end-radius: 8px; border-end-end-radius: 8px; }
.split { position: relative; display: inline-flex; }
.menu { position: absolute; top: calc(100% + 4px); inset-inline-end: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 220px; z-index: 60; display: none; }
.menu.open { display: block; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 8px 10px; background: none; border: 0; border-radius: 7px; cursor: pointer; text-align: start; font-size: 13px; }
.menu button:hover { background: var(--surface-2); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu small { color: var(--muted); display: block; font-size: 11.5px; }

/* ---------- البطاقات والصفحة ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.page-head h1 { font-size: 21px; margin: 0; font-weight: 700; }
.page-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card + .card { margin-top: 14px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 14.5px; font-weight: 700; }
.card-b { padding: 16px; }
.toolbar { position: sticky; top: var(--topbar-h); z-index: 20; background: var(--bg); padding: 8px 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.toolbar.in-card { position: static; background: transparent; padding: 0; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.accent { border-top: 3px solid var(--brand); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .ic { width: 42px; height: 42px; opacity: .45; margin-bottom: 8px; }
.empty h4 { margin: 0 0 4px; color: var(--ink-2); font-size: 15px; }
.banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 9px; border: 1px solid; font-size: 13px; margin-bottom: 12px; }
.banner.warn { background: var(--warn-50); border-color: #f5d7a8; color: #7c3d06; }
.banner.bad { background: var(--bad-50); border-color: #f4c2c2; color: #7f1d1d; }
.banner.info { background: var(--info-50); border-color: #c9d8fb; color: #1e3a8a; }
.banner.ok { background: var(--ok-50); border-color: #bfe6dd; color: #134e4a; }
.banner .grow { flex: 1; }

/* ---------- النماذج ---------- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--muted); min-height: 16px; }
.inp, .field input:not([type=checkbox]):not([type=radio]):not([type=color]), .field select, .field textarea, select.inp {
    height: 38px; padding: 0 11px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; width: 100%; transition: border-color .12s, box-shadow .12s;
}
.field textarea, textarea.inp { height: auto; padding: 9px 11px; resize: vertical; min-height: 72px; }
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
.inp.sm { height: 32px; font-size: 13px; }
.inp.invalid, .field input.invalid { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-50); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 16px; }
.form-grid .span2 { grid-column: span 2; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 13px; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: #cbd5e1; position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.switch input::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: right .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--brand); }
.switch input:checked::after { right: 16px; }
.seg { display: inline-flex; background: #eef1f5; border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.search { position: relative; }
.search input { padding-inline-start: 34px !important; }
.search .ic { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.opt-panel { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
.opt-panel .grp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.opt-panel .grp > .lbl { color: var(--muted); font-weight: 600; }
.cols-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 14px; }

/* ---------- الجداول ---------- */
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-height: calc(100vh - 210px); }
.table-wrap.free { max-height: none; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.tbl thead th { position: sticky; top: 0; z-index: 2; background: #f1f4f8; color: var(--ink-2); font-weight: 700; font-size: 12.5px; border-bottom: 1px solid var(--line-2); }
.tbl tfoot td { position: sticky; bottom: 0; z-index: 2; background: #eef6f3; font-weight: 700; border-top: 2px solid #9fd3c5; }
.tbl tbody tr:hover td { background: #f8fafc; }
.tbl td.name, .tbl th.name { text-align: start; }
.tbl td.name { font-weight: 600; }
.tbl td.wrap { white-space: normal; min-width: 180px; text-align: start; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.sec td { background: #eef2f7 !important; font-weight: 700; text-align: start; color: var(--ink-2); }
.tbl tr.tot td { background: #e7f4ef !important; font-weight: 700; border-top: 2px solid #9fd3c5; }
.tbl tr.left td { color: var(--faint); }
.tbl .c-gross { background: var(--gross-bg); font-weight: 700; }
.tbl .c-net { background: var(--net-bg); color: var(--net-ink); font-weight: 700; }
.tbl .c-ded { color: var(--bad); }
.tbl .c-plus { color: var(--info); }
.tbl .c-neg { background: var(--bad-50) !important; color: var(--bad) !important; font-weight: 700; }
.tbl .sticky-col { position: sticky; inset-inline-start: 0; z-index: 1; background: var(--surface); }
.tbl thead .sticky-col { z-index: 3; background: #f1f4f8; }
.tbl tfoot .sticky-col { z-index: 3; background: #eef6f3; }
.tbl input.cell { width: 86px; height: 32px; border: 1px solid transparent; border-radius: 6px; text-align: center; background: #f6f8fb; padding: 0 6px; }
.tbl input.cell:hover { border-color: var(--line-2); }
.tbl input.cell:focus { outline: none; border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px var(--brand-100); }
.tbl input.cell:disabled { background: transparent; color: var(--muted); }
.tbl input.cell.has { background: #fff8e8; border-color: #f3dcb0; font-weight: 700; }
.row-actions { display: inline-flex; gap: 4px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: #eef1f5; color: var(--ink-2); }
.pill.bank { background: var(--info-50); color: var(--info); }
.pill.cash { background: var(--ok-50); color: var(--ok); }
.pill.left { background: #f1f5f9; color: var(--muted); }
.pill.warn { background: var(--warn-50); color: var(--warn); }
.pill.bad { background: var(--bad-50); color: var(--bad); }

/* ---------- الدرج (Drawer) والمودال ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slide { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; animation: pop .15s; }
.modal.lg { width: min(900px, 100%); } .modal.xl { width: min(1200px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0; font-size: 16px; flex: 1; }
.modal-b { padding: 16px 18px; overflow: auto; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 14px 14px; flex-wrap: wrap; }
.modal-f .grow { flex: 1; }
.overlay.drawer-ov { justify-content: flex-end; align-items: stretch; padding: 0; }
.drawer { background: var(--surface); width: min(820px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slide .16s; margin-inline-end: auto; margin-inline-start: 0; }
.drawer-h { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer-h.edit { background: #fff7ea; border-bottom-color: #f5d7a8; }
.drawer-h.new { background: var(--brand-50); border-bottom-color: var(--brand-200); }
.drawer-h .who { flex: 1; min-width: 0; }
.drawer-h .who .mode { font-size: 11.5px; font-weight: 700; }
.drawer-h.edit .mode { color: var(--warn); } .drawer-h.new .mode { color: var(--brand); }
.drawer-h .who .nm { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.drawer-tabs button { border: 0; background: none; padding: 11px 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; }
.drawer-tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
.drawer-tabs button .err { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); margin-inline-start: 5px; vertical-align: middle; }
.drawer-b { flex: 1; overflow: auto; padding: 18px; }
.drawer-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; background: var(--surface-2); flex-wrap: wrap; }
.drawer-f .grow { flex: 1; }
.nav-ctl { display: inline-flex; align-items: center; gap: 2px; }
.nav-ctl .pos { font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.dirty { color: var(--warn); font-size: 12px; font-weight: 700; }
.items-box { border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--surface-2); }
.item-row { display: grid; grid-template-columns: 1.6fr .9fr .9fr 1.1fr 1.1fr 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
.item-row.ded { grid-template-columns: 1.6fr .9fr .9fr 1.1fr 34px; }
.item-sum { font-size: 12px; color: var(--muted); margin-top: 4px; }
.calc-preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.calc-preview div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.calc-preview div span { display: block; font-size: 11.5px; color: var(--muted); }
.calc-preview div b { font-variant-numeric: tabular-nums; }
.toast-wrap { position: fixed; bottom: 18px; left: 18px; z-index: 120; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: #0f172a; color: #fff; padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; animation: pop .15s; white-space: pre-line; }
.toast.ok { background: #0f5f55; } .toast.danger { background: #991b1b; } .toast.warn { background: #92400e; }
.toast button { background: none; border: 0; color: #fff; opacity: .7; cursor: pointer; margin-inline-start: auto; }

/* ---------- الرئيسية ---------- */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: start; }
.step:hover { border-color: var(--brand-200); background: var(--brand-50); }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: #eef1f5; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.step.done .n { background: var(--ok); color: #fff; }
.step .t { font-weight: 700; font-size: 13px; }
.step .d { font-size: 12px; color: var(--muted); }
.hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.hub-card { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: start; box-shadow: var(--shadow); }
.hub-card:hover { border-color: var(--brand-200); box-shadow: 0 4px 14px rgba(15,23,42,.08); }
.hub-card .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; flex: none; }
.hub-card .ico .ic { width: 20px; height: 20px; }
.hub-card h4 { margin: 0 0 2px; font-size: 14px; }
.hub-card p { margin: 0; font-size: 12.5px; color: var(--muted); }
.hub-card .tags { margin-top: 6px; display: flex; gap: 4px; }

/* ---------- ورقة التقرير (معاينة شاشة) ---------- */
.paper { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
.rep-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 14px; }
.rep-head .co { display: flex; align-items: center; gap: 10px; }
.rep-head .co img { max-height: 54px; max-width: 120px; object-fit: contain; }
.rep-head .co .nm { font-weight: 700; font-size: 15px; }
.rep-head .co .meta { font-size: 11px; color: #475569; }
.rep-head .ttl { text-align: center; }
.rep-head .ttl h2 { margin: 0; font-size: 17px; }
.rep-head .ttl .sub { font-size: 12.5px; color: #334155; margin-top: 2px; }
.rep-head .dt { text-align: end; font-size: 11.5px; color: #475569; }
.rb-h { font-size: 14.5px; font-weight: 700; margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 2px solid var(--brand); color: var(--ink); }
.rb-h:first-child { margin-top: 0; }
.rb-note { font-size: 12.5px; padding: 8px 12px; border-radius: 8px; margin: 8px 0; background: #f8fafc; border: 1px solid var(--line); }
.rb-note.warn { background: var(--warn-50); border-color: #f5d7a8; color: #7c3d06; }
.rb-note.bad { background: var(--bad-50); border-color: #f4c2c2; color: #7f1d1d; }
.rb-note.info { background: var(--info-50); border-color: #c9d8fb; color: #1e3a8a; }
.rb-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.rb-kpis div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.rb-kpis span { display: block; font-size: 11.5px; color: #475569; }
.rb-kpis b { font-size: 16px; font-variant-numeric: tabular-nums; }
.rb-total { border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; margin-top: 14px; break-inside: avoid; }
.rb-total .row1 { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.rb-total .row1 span { font-size: 16px; font-weight: 700; }
.rb-total .row1 b { font-size: 22px; font-variant-numeric: tabular-nums; border-bottom: 3px double currentColor; }
.rb-total .taf { margin-top: 6px; font-weight: 700; font-size: 13.5px; }
.rb-total .extra { display: flex; gap: 24px; justify-content: space-around; margin-top: 8px; font-weight: 700; font-size: 13.5px; }
.rb-keep { break-inside: avoid; page-break-inside: avoid; }
.rb-break { break-before: page; page-break-before: always; }
table.rt { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 4px; }
.rt th, .rt td { border: 1px solid #94a3b8; padding: 5px 6px; text-align: center; }
.rt thead th { background: #e2e8f0; font-weight: 700; }
.rt td.t-name { text-align: start; font-weight: 600; white-space: nowrap; }
.rt td.t-wrap { text-align: start; }
.rt.w1 td.t-txt { white-space: nowrap; }
.rt tr.sec td { background: #f1f5f9; font-weight: 700; text-align: start; }
.rt tr.tot td { background: #e7f4ef; font-weight: 700; border-top: 2.5px double #0f766e; }
.rt .c-gross { background: #e6efff; font-weight: 700; }
.rt .c-net { background: #e4f5ee; color: #0b5e4a; font-weight: 700; }
.rt .c-ded { color: #b91c1c; }
.rt .c-plus { color: #1e40af; }
.rt .c-neg { background: #fdecec; color: #b91c1c; font-weight: 700; }
.rt .c-strong { font-weight: 700; }
.rt .c-soft { background: #f8fafc; }
.rt td.money, .rt td.int { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- شيت القبض ---------- */
.slips { max-width: 820px; margin: 0 auto; }
.emp-block { break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
.qabd { border: 1.5px solid #000; border-radius: 6px; padding: 12px 16px; background: #fff; font-size: 13px; color: #000; }
.qabd.q-big { padding: 16px 20px; }
.qabd.q-small { font-size: 11px; padding: 8px 12px; margin-top: 4px; }
.qabd.neg { border-color: var(--bad); }
.q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 1.5px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
.q-name { font-weight: 700; text-align: start; }
.q-big .q-name { font-size: var(--slip-name, 30px); line-height: 1.25; }
.q-small .q-name { font-size: 15px; }
.q-co { text-align: center; font-size: 12px; font-weight: 700; }
.q-co .q-m { font-weight: 400; margin-top: 2px; }
.q-co img { max-height: 28px; display: block; margin: 0 auto 2px; }
.q-spacer { height: var(--slip-spacer, 45mm); }
.q-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.q-sec { font-weight: 700; margin-bottom: 3px; border-bottom: 1px solid #999; }
.q-line { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px dotted #ccc; }
.q-line.sub { border-bottom: none; font-size: .88em; color: #555; }
.q-line small { color: #555; }
.q-tot { font-weight: 700; border-top: 1px solid #999; border-bottom: 0; padding-top: 3px; }
.q-net { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; background: #f2f2f2; padding: 6px 10px; border-radius: 4px; gap: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.q-net .taf { flex: 1; text-align: center; font-weight: 700; font-size: 13.5px; }
.q-small .q-net .taf { font-size: 10px; }
.q-net b { font-size: 17px; white-space: nowrap; }
.q-small .q-net b { font-size: 14px; }
.q-sign { margin-top: 16px; font-size: 18px; }
.cut-line { text-align: center; color: #999; font-size: 11px; letter-spacing: 2px; margin: 6px 0 4px; }

/* ---------- إخفاء الأرقام المالية ---------- */
.hide-money .mval { color: transparent !important; position: relative; }
.hide-money .mval::after { content: '******'; position: absolute; inset: 0; color: var(--muted); text-align: center; letter-spacing: 1px; }
.hide-money .mval:empty::after { content: none; }
.hide-money .kpi .v .mval::after, .hide-money .rb-total .mval::after { text-align: start; }

/* ---------- المعالج ---------- */
.wizard { max-width: 720px; margin: 40px auto; }
.wz-steps { display: flex; gap: 6px; margin-bottom: 16px; }
.wz-steps div { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.wz-steps div.on { background: var(--brand); }
.choice { display: flex; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; align-items: flex-start; background: #fff; text-align: start; width: 100%; }
.choice:hover { border-color: var(--brand-200); }
.choice.on { border-color: var(--brand); background: var(--brand-50); }
.choice h4 { margin: 0; font-size: 14px; } .choice p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.logo-drop { display: flex; align-items: center; gap: 14px; }
.logo-drop .pv { width: 84px; height: 84px; border: 1.5px dashed var(--line-2); border-radius: 12px; display: grid; place-items: center; overflow: hidden; background: #fff; color: var(--faint); font-size: 11px; }
.logo-drop .pv img { max-width: 100%; max-height: 100%; object-fit: contain; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-2); cursor: pointer; }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
.settings-nav { position: sticky; top: calc(var(--topbar-h) + 14px); display: flex; flex-direction: column; gap: 2px; }
.settings-nav button { text-align: start; border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.settings-nav button:hover { background: #eef1f5; }
.settings-nav button.on { background: var(--brand-50); color: var(--brand); }
.settings-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 18px; align-items: start; }
.denoms { display: flex; flex-wrap: wrap; gap: 6px; }
.denoms span { background: #eef1f5; border-radius: 6px; padding: 3px 8px; display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }
.denoms span button { border: 0; background: none; cursor: pointer; color: var(--bad); padding: 0; }
.log-list { max-height: 420px; overflow: auto; font-size: 12.5px; }
.log-list div { display: flex; gap: 10px; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.log-list time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.drop-zone { border: 2px dashed var(--line-2); border-radius: 12px; padding: 22px; text-align: center; background: var(--surface-2); cursor: pointer; }
.drop-zone:hover, .drop-zone.over { border-color: var(--brand); background: var(--brand-50); }
.meter { height: 8px; background: #eef1f5; border-radius: 4px; overflow: hidden; }
.meter > div { height: 100%; background: var(--brand); }
.wa-msg { white-space: pre-wrap; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 12px; font-size: 12.5px; text-align: start; line-height: 1.7; }
.mini-list { display: flex; flex-direction: column; gap: 6px; }
.mini-list .it { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
.chips-list { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-list .chip { font-weight: 500; }
details.fold > summary { cursor: pointer; font-weight: 600; padding: 4px 0; }

/* ---------- الاستجابة ---------- */
@media (max-width: 1100px) {
    .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .settings-layout { grid-template-columns: 1fr; }
    .settings-nav { position: static; flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 860px) {
    .sidebar { transform: translateX(100%); }
    .app.nav-open .sidebar { transform: none; box-shadow: var(--shadow-lg); }
    .app.nav-open::after { content: ''; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 35; }
    .main { margin-inline-start: 0; }
    .btn.tb-menu { display: inline-flex; }
    .topbar { padding: 0 12px; gap: 8px; }
    .tb-hide-sm, .tb-title { display: none !important; }
    .tb-spacer { display: none; }
    .page-head h1 { font-size: 18px; }
    .opt-panel { gap: 8px 14px; }
    .content { padding: 14px 12px 60px; }
    .g2, .g3, .g4 { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: auto; }
    .item-row, .item-row.ded { grid-template-columns: 1fr 1fr; }
    .rep-head { grid-template-columns: 1fr; text-align: center; }
    .rep-head .co { justify-content: center; } .rep-head .dt { text-align: center; }
    .paper { padding: 14px; }
    .month-ctl input { width: 118px; }
}

/* =====================================================================
   الطباعة — إطار موحّد: رأس وتذييل يتكرران في كل صفحة
   ===================================================================== */
#printRoot { display: none; }
@media print {
    @page { margin: 0; }
    html, body { background: #fff !important; }
    body.printing > *:not(#printRoot) { display: none !important; }
    body.printing #printRoot { display: block; }
    body.printing { font-size: 11.5px; }
    .hide-money .mval { color: inherit !important; }
    .hide-money .mval::after { content: none !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.pframe { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .rt.w2 { font-size: 9.5px; } .rt.w3 { font-size: 8.6px; } .rt.w4 { font-size: 7.8px; }
    .rt.w3 th, .rt.w3 td, .rt.w4 th, .rt.w4 td { padding: 2px 2.5px; }
    .rt.w4 td.t-name { white-space: normal; }
    table.pframe > thead > tr > td, table.pframe > tfoot > tr > td, table.pframe > tbody > tr > td { padding: 0 11mm; border: 0; }
    .pf-top { height: 9mm; } .pf-bottom { height: 8mm; }
    .phead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; border-bottom: 1.6px solid #000; padding-bottom: 5px; margin-bottom: 8px; }
    .phead .co { display: flex; align-items: center; gap: 8px; }
    .phead .co img { max-height: 40px; max-width: 95px; object-fit: contain; }
    .phead .co .nm { font-weight: 700; font-size: 13px; }
    .phead .co .meta { font-size: 9.5px; color: #333; }
    .phead .ttl { text-align: center; }
    .phead .ttl h2 { margin: 0; font-size: 14.5px; }
    .phead .ttl .sub { font-size: 11px; margin-top: 1px; }
    .phead .dt { text-align: end; font-size: 9.5px; color: #333; }
    .pfoot { border-top: 1px solid #999; margin-top: 6px; padding-top: 3px; font-size: 9px; color: #444; display: flex; justify-content: space-between; }
    .rt { font-size: 10.5px; }
    .rt th, .rt td { padding: 3px 4px; border-color: #666; }
    .rt thead { display: table-header-group; }
    .rt tr { break-inside: avoid; page-break-inside: avoid; }
    .rb-h { margin: 10px 0 5px; font-size: 12.5px; border-bottom-color: #000; }
    .rb-h.first, .rb-keep > .rb-h:first-child { margin-top: 0; }
    .rb-kpis b { font-size: 13px; }
    .rb-total .row1 span { font-size: 13px; } .rb-total .row1 b { font-size: 17px; } .rb-total .taf { font-size: 11.5px; }
    .bare-print { padding: 8mm 10mm; }
    .slips { max-width: none; }
    .qabd { border: 1.2px solid #000 !important; }
    .emp-block { margin-bottom: 6mm; }
    .mval { color: inherit; }
}
.paper { overflow-x: auto; }
@media print { .paper { overflow: visible; } }
